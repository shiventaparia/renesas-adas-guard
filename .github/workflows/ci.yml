name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run unit tests
        run: make test
      - name: Check Python syntax
        run: make syntax

  cpp-demo:
    name: C++ compile and demo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile and run host demo
        run: make demo
      - name: Run scripted scenario smoke test
        run: make scenario
